[window]
opacity = 0.85
blur = true
decorations = "none"
padding = { x = 12, y = 12 }
dynamic_padding = true

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[colors.primary]
background = "#161616"
foreground = "#f2f4f8"
dim_foreground = "#c1c7cd"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#161616"
cursor = "#9db89a"

[colors.vi_mode_cursor]
text = "#161616"
cursor = "#be95ff"

[colors.selection]
text = "#f2f4f8"
background = "#3b4a3a"

[colors.search.matches]
foreground = "#161616"
background = "#9db89a"

[colors.search.focused_match]
foreground = "#161616"
background = "#ee5396"

[colors.footer_bar]
foreground = "#f2f4f8"
background = "#262626"

[colors.hints.start]
foreground = "#161616"
background = "#9db89a"

[colors.hints.end]
foreground = "#161616"
background = "#78a9ff"

[colors.normal]
black   = "#262626"
red     = "#ee5396"
green   = "#9db89a"
yellow  = "#ffe97b"
blue    = "#33b1ff"
magenta = "#be95ff"
cyan    = "#08bdba"
white   = "#dde1e6"

[colors.bright]
black   = "#393939"
red     = "#ff7eb6"
green   = "#b5cdb2"
yellow  = "#fff2a8"
blue    = "#78a9ff"
magenta = "#d4bbff"
cyan    = "#3ddbd9"
white   = "#ffffff"
