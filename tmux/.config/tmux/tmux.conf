# ── Core ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-keys emacs

# ── Prefix: Ctrl-a ──────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Keybinds ────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode, vi style
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Theme ───────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#dde1e6"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#161616,bg=#9db89a,bold]  #S #[fg=#9db89a,bg=default] "
set -g status-right "#[fg=#78a9ff]%a %b %d #[fg=#525252]│ #[fg=#9db89a]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#525252] #I #W "
setw -g window-status-current-format "#[fg=#9db89a,bold] #I #W "
setw -g window-status-activity-style "fg=#ee5396"

# Panes
set -g pane-border-style "fg=#393939"
set -g pane-active-border-style "fg=#9db89a"
set -g display-panes-colour "#393939"
set -g display-panes-active-colour "#9db89a"

# Messages and command prompt
set -g message-style "bg=#262626,fg=#9db89a"
set -g message-command-style "bg=#262626,fg=#be95ff"

# Copy mode / selection highlight
setw -g mode-style "bg=#3b4a3a,fg=#f2f4f8"

# Clock mode
setw -g clock-mode-colour "#9db89a"
